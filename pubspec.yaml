name: foodlink
description: "FoodLink: food distribution campaign coordination app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Photos are credited in assets/images/CREDITS.md.
  assets:
    - assets/images/splash_giving.jpg
    - assets/images/onboarding_community_meal.jpg
    - assets/images/impact_packing.jpg
    - assets/images/change_volunteers.jpg
    - assets/images/role_volunteer.jpg
    - assets/images/role_coordinator.jpg

  # Fraunces (headings) and Plus Jakarta Sans (body), both SIL OFL 1.1.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
